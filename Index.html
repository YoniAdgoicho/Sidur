<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>סידור העבודה שלי</title>
  <style>
    /* עיצוב מסך הכניסה בסיסמה */
    #login-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      font-family: system-ui, -apple-system, sans-serif;
    }

    #login-box {
      background: #1e1e1e;
      padding: 2rem;
      border-radius: 12px;
      text-align: center;
      width: 85%;
      max-width: 320px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      border: 1px solid #333;
    }

    #login-box h2 {
      margin-top: 0;
      font-size: 1.4rem;
      color: #fff;
    }

    #login-box input {
      padding: 12px;
      margin: 15px 0;
      border: 1px solid #444;
      background: #2a2a2a;
      color: #fff;
      border-radius: 8px;
      font-size: 1.1rem;
      width: 90%;
      text-align: center;
      outline: none;
    }

    #login-box button {
      padding: 12px 24px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      width: 90%;
      cursor: pointer;
    }

    #error-msg {
      color: #ef4444;
      display: none;
      margin-top: 10px;
      font-size: 0.9rem;
    }

    .hidden {
      display: none !important;
    }

    /* עיצוב האפליקציה */
    *{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#111827}
    header{background:#111827;color:white;padding:18px 16px;position:sticky;top:0;z-index:5}
    h1{margin:0 0 6px;font-size:23px}.sub{opacity:.8;font-size:13px}
    main{max-width:1100px;margin:auto;padding:14px}
    .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
    .card{background:white;border-radius:14px;padding:14px;box-shadow:0 2px 8px #00000010}.label{font-size:12px;color:#6b7280}.value{font-size:22px;font-weight:bold;margin-top:5px}
    .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
    button,.filebtn{border:0;border-radius:10px;padding:11px 14px;background:#2563eb;color:#fff;font-weight:bold;cursor:pointer}
    button.secondary,.filebtn.secondary{background:#e5e7eb;color:#111827}button.danger{background:#dc2626}
    input,select{padding:10px;border:1px solid #d1d5db;border-radius:9px;background:white}
    .panel{background:white;border-radius:14px;padding:14px;box-shadow:0 2px 8px #00000010;margin-bottom:14px}
    .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.dow{font-size:12px;color:#6b7280;text-align:center;padding:5px}
    .day{min-height:115px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:10px;padding:7px;cursor:pointer}.day:hover{border-color:#2563eb}
    .day.empty{background:transparent;border:0;cursor:default}.num{font-weight:bold}.shift{margin-top:7px;background:#dbeafe;border-radius:7px;padding:6px;font-size:12px}.shift.sat{background:#fee2e2}.shift.night{background:#ede9fe}
    table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px;border-bottom:1px solid #eee;text-align:right}th{background:#f9fafb}
    .modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.box{background:white;border-radius:16px;padding:18px;width:min(500px,100%)}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form label{font-size:12px;color:#4b5563}.form input,.form select{width:100%;margin-top:4px}
    .full{grid-column:1/-1}.note{font-size:12px;color:#6b7280;line-height:1.5}
    .schedule-result{border:1px solid #e5e7eb;border-radius:10px;margin:7px 0;background:#fff;overflow:hidden}.schedule-result summary{cursor:pointer;padding:9px 11px;list-style:none;background:#f8fafc}.schedule-result summary::-webkit-details-marker{display:none}.worker-head{display:flex;justify-content:space-between;align-items:center;gap:8px}.worker-code{font-size:11px;color:#6b7280;background:#eef2ff;border-radius:999px;padding:3px 7px}.compact-week{padding:4px 8px 7px}.compact-day{display:grid;grid-template-columns:90px 1fr auto;gap:8px;align-items:center;padding:6px 3px;border-bottom:1px solid #f0f0f0;font-size:13px}.compact-day:last-child{border-bottom:0}.compact-date{font-weight:700;white-space:nowrap}.compact-task{min-width:0;line-height:1.3}.compact-hours{white-space:nowrap;font-weight:700;font-size:12px;color:#374151}.rest{font-weight:700;color:#6b7280}.source-note{font-size:10px;color:#9ca3af;padding:0 10px 7px}.search-hint{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.chip{background:#f3f4f6;border-radius:999px;padding:5px 9px;font-size:12px}
    .search-tools{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin-bottom:8px}
    .search-tools input,.search-tools select{min-width:0}
    .search-meta{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}
    .search-meta .chip{background:#eef2ff}
    mark{background:#fde68a;padding:0 1px;border-radius:2px}

    :root{--primary:#2563eb;--primary-dark:#1d4ed8;--bg:#f5f7fb;--text:#111827;--muted:#64748b;--card:#fff}
    html{scroll-behavior:smooth}body{background:var(--bg);color:var(--text);font-family:Arial,"Noto Sans Hebrew",sans-serif}
    header{background:linear-gradient(135deg,#111827,#1e3a8a);padding:16px 16px 22px;border-radius:0 0 24px 24px;box-shadow:0 5px 20px #0f172a22;position:relative}
    header h1{font-size:22px;margin:0 0 4px}.sub{font-size:12px;color:#dbeafe}
    .app-nav{display:flex;gap:8px;overflow:auto;margin:14px auto 0;max-width:1100px;padding-bottom:2px}
    .app-nav button{flex:0 0 auto;background:#ffffff18;color:#fff;border:1px solid #ffffff22;padding:9px 13px;border-radius:999px;font-size:13px}
    .app-nav button.active{background:#fff;color:#1e3a8a}
    main{max-width:1100px;padding:14px}
    .hero-search{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:16px;box-shadow:0 8px 24px #0f172a0c;margin-bottom:14px}
    .hero-search h2{font-size:18px;margin:0 0 5px}.hero-search .note{margin:0 0 12px}
    .search-main{position:relative}.search-main input{width:100%;height:52px;border:2px solid #dbe3ef;border-radius:15px;padding:0 46px 0 14px;font-size:16px;outline:none;box-shadow:0 2px 8px #0f172a08}
    .search-main input:focus{border-color:#60a5fa;box-shadow:0 0 0 4px #3b82f61a}
    .search-icon{position:absolute;right:15px;top:15px;font-size:20px;color:#64748b;pointer-events:none}
    .quick-chips{display:flex;gap:7px;overflow:auto;margin-top:10px;padding-bottom:2px}
    .quick-chips button{background:#eff6ff;color:#1d4ed8;border:1px solid #dbeafe;border-radius:999px;padding:8px 12px;font-size:12px;white-space:nowrap}
    .filter-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
    .filter-row input,.filter-row select{width:100%;height:42px}
    .search-meta{margin:10px 0 4px}
    .schedule-result{border:0;box-shadow:0 3px 12px #0f172a0b;margin:9px 0;border-radius:15px}
    .schedule-result summary{background:#fff;padding:12px 14px}
    .worker-head b{font-size:15px}.worker-code{background:#eff6ff;color:#1d4ed8}
    .compact-week{padding:4px 10px 9px;background:#fff}
    .compact-day{grid-template-columns:82px 1fr auto;padding:10px 4px}
    .compact-task{font-size:13px}.compact-hours{color:#1d4ed8}
    .section-title{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .section-title h2,.section-title h3{margin:0}
    .home-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px}
    .home-card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:13px;box-shadow:0 4px 14px #0f172a08}
    .home-card .icon{font-size:20px}.home-card .small{font-size:11px;color:var(--muted);margin-top:6px}.home-card strong{display:block;font-size:16px;margin-top:3px}
    .today-panel{background:#fff;border-radius:18px;border:1px solid #e5e7eb;padding:15px;box-shadow:0 5px 18px #0f172a09;margin-bottom:14px}
    .pill{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;background:#f1f5f9;color:#475569;font-size:11px;font-weight:700}
    
    @media(max-width:600px){
      .home-cards{grid-template-columns:repeat(3,1fr)}.home-card{padding:10px 8px}.home-card strong{font-size:14px}
      .filter-row{grid-template-columns:1fr}.cards{display:none}
      main{padding:10px}.hero-search{padding:13px}
      .compact-day{grid-template-columns:72px 1fr}.compact-hours{grid-column:2}
      .search-tools{grid-template-columns:1fr 1fr}.search-tools input{grid-column:1/-1}
      .worker-head{font-size:14px}
    }
    @media(min-width:701px){.app-nav{justify-content:flex-start}.hero-search{padding:20px}.search-main input{height:56px}}
  </style>
</head>
<body>

  <!-- מסך התחברות בסיסמה -->
  <div id="login-overlay">
    <div id="login-box">
      <h2>כניסה לסידור העבודה</h2>
      <input type="password" id="password-input" placeholder="הכנס סיסמה" onkeydown="if(event.key==='Enter') checkPassword()">
      <button type="button" onclick="checkPassword()">התחבר</button>
      <p id="error-msg">סיסמה שגויה!</p>
    </div>
  </div>

  <!-- תוכן האפליקציה הראשי -->
  <div id="app-content" class="hidden">
    <header>
      <div style="max-width:1100px;margin:auto">
        <h1>🚆 סידור העבודה שלי</h1>
        <div class="sub">מצא משמרת, עובד או משימה — במהירות</div>
        <div class="app-nav">
          <button class="active" onclick="scrollToSection('scheduleSearchPanel',this)">🔎 חיפוש</button>
          <button onclick="focusMyShifts()">👤 המשמרות שלי</button>
          <button onclick="scrollToSection('calendarPanel',this)">📅 לוח</button>
          <button onclick="scrollToSection('detailsPanel',this)">📋 פירוט</button>
        </div>
      </div>
    </header>
    <main>
      <div class="home-cards">
        <div class="home-card"><div class="icon">🔎</div><div class="small">חיפוש מהיר</div><strong>כל הסידור</strong></div>
        <div class="home-card"><div class="icon">📅</div><div class="small">תקופת הסידור</div><strong>7 ימים</strong></div>
        <div class="home-card"><div class="icon">👥</div><div class="small">עובדים</div><strong id="workerCountHome">—</strong></div>
      </div>
      <div class="today-panel">
        <div class="section-title"><h3>⚡ קיצורים</h3><span class="pill">לחץ כדי לחפש</span></div>
        <div class="quick-chips" style="margin-top:8px">
          <button onclick="focusMyShifts()">👤 מצא את עצמי</button>
          <button onclick="setScheduleSearch('מונית')">🚕 מי במונית?</button>
          <button onclick="setScheduleSearch('בדק')">🔧 מי עושה בדק?</button>
          <button onclick="setScheduleSearch('מנוחה')">😴 מי במנוחה?</button>
        </div>
      </div>

      <div class="cards">
